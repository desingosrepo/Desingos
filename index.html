<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designos - iOS Tema Mağazası</title>
    <style>
        /* Renk Paletimiz ve Temel Ayarlar */
        :root {
            --bg-color: #121212;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --accent-amber: #F59E0B;
            --accent-navy: #1E3A8A;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Üst Kısım (Header) */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent-amber); /* 'OS' kısmı turuncu */
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Tema Kartları Alanı */
        .container {
            width: 90%;
            max-width: 1000px;
            padding: 20px 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Tekil Tema Kartı */
        .theme-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-amber);
        }

        .theme-image {
            width: 100%;
            height: 180px;
            background-color: #2C2C2E;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .theme-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 5px 0;
        }

        .theme-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* İndir Butonu */
        .download-btn {
            background-color: var(--accent-amber);
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: auto;
        }

        .download-btn:hover {
            background-color: #FBBF24;
        }
    </style>
</head>
<body>

    <header>
        <h1>DESIGN<span>OS</span></h1>
        <p class="subtitle">iPhone'nu Kendin Gibi Yap</p>
    </header>

    <div class="container">
        <!-- Örnek Tema 1 -->
        <div class="theme-card">
            <div class="theme-image">Önizleme Görseli</div>
            <h2 class="theme-title">Karanlık Minimal</h2>
            <p class="theme-info">iOS 16+ • 150 İkon</p>
            <a href="#" class="download-btn">İndir (.deb)</a>
        </div>

        <!-- Örnek Tema 2 -->
        <div class="theme-card">
            <div class="theme-image">Önizleme Görseli</div>
            <h2 class="theme-title">Neon Cyberpunk</h2>
            <p class="theme-info">iOS 16+ • 80 İkon</p>
            <a href="#" class="download-btn">İndir (.zip)</a>
        </div>
        
        <!-- Örnek Tema 3 -->
        <div class="theme-card">
            <div class="theme-image">Önizleme Görseli</div>
            <h2 class="theme-title">Renkli Kareler</h2>
            <p class="theme-info">iOS 15-16 • 200 İkon</p>
            <a href="#" class="download-btn">İndir (.zip)</a>
        </div>
    </div>

</body>
</html>
